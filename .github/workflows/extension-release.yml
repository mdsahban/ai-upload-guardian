name: Extension Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      PUBLIC_RELEASE_REPO: mdsahban/ai-upload-guardian-public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Package extension zip
        run: python admin-panel/scripts/package_extension.py

      - name: Upload release asset
        uses: ncipollo/release-action@v1
        with:
          owner: mdsahban
          repo: ai-upload-guardian-public
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          artifacts: dist/ai-upload-guardian-extension-v*.zip
          artifactErrorsFailBuild: true
          generateReleaseNotes: true
          allowUpdates: true
          replacesArtifacts: true
