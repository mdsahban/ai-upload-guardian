name: Extension Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      PUBLIC_RELEASE_REPO: mdsahban/ai-upload-guardian-public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Package extension zip
        run: python admin-panel/scripts/package_extension.py

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.PUBLIC_RELEASE_REPO }}
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          files: dist/ai-upload-guardian-extension-v*.zip
          generate_release_notes: true
